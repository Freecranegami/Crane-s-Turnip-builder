name: Build Turnip

on:
  schedule:
    - cron: "0 */6 * * *"     # check upstream every 6 hours
  push:
    paths: ["patches/**", "build.sh", "config.env", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch/tag (blank = config.env default)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Load config
        id: cfg
        run: |
          source config.env
          REF="${{ github.event.inputs.mesa_ref }}"
          REF="${REF:-$MESA_REF}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          SHA=$(git ls-remote "$MESA_REPO" "$REF" | cut -c1-7 | head -n1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if already released (scheduled runs only)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mesa-${{ steps.cfg.outputs.sha }}"
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-mako python3-yaml \
            glslang-tools bison flex pkg-config ccache zip patchelf libdrm-dev
          # Ubuntu's meson is too old for current Mesa (needs >= 1.7), so use pip's
          python3 -m pip install --user --break-system-packages "meson>=1.7.0" packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Setup NDK
        if: steps.check.outputs.skip == 'false'
        id: ndk
        run: |
          NDK="android-ndk-${{ steps.cfg.outputs.ndk }}"
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/${NDK}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ndk-path=$RUNNER_TEMP/$NDK" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.check.outputs.skip == 'false'
        with:
          path: ~/.ccache
          key: ccache-${{ steps.cfg.outputs.sha }}
          restore-keys: ccache-

      - name: Build
        if: steps.check.outputs.skip == 'false'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build.sh "${{ steps.cfg.outputs.ref }}"

      - name: Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mesa-${{ steps.cfg.outputs.sha }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/*.zip \
            --title "Turnip @ Mesa ${{ steps.cfg.outputs.sha }}" \
            --notes "Mesa ${{ steps.cfg.outputs.ref }} @ ${{ steps.cfg.outputs.sha }} with patches from /patches"
